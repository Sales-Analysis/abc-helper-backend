basePath: /
definitions:
  version.Info:
    properties:
      built_at:
        type: string
      commit:
        type: string
      version:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: vladislavtagaev@gmail.com
    name: ABC Helper Team
    url: https://github.com/Sales-Analysis/abc-helper-backend
  description: Minimal HTTP API for abc-helper-backend (hello, probes, version).
  title: ABC Helper Backend API
  version: 0.1.0
paths:
  /:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Hello world
      tags:
      - root
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness
      tags:
      - health
  /ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness
      tags:
      - health

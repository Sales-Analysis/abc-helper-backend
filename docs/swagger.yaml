basePath: /
definitions:
  version.Info:
    properties:
      built_at:
        type: string
      commit:
        type: string
      version:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: vladislavtagaev@gmail.com
    name: ABC Helper Team
    url: https://github.com/Sales-Analysis/abc-helper-backend
  description: Minimal HTTP API for abc-helper-backend (hello, probes, version).
  title: ABC Helper Backend API
  version: 0.1.0
paths:
  /:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Hello world
      tags:
      - root
  /api/v1/abc/upload:
    post:
      consumes:
      - multipart/form-data
      description: Accepts an XLSX file, validates it and returns OK if valid.
      parameters:
      - description: XLSX file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Upload ABC XLSX
      tags:
      - analysis
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness
      tags:
      - health
  /ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness
      tags:
      - health
  /version:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/version.Info'
      summary: Build info
      tags:
      - meta
swagger: "2.0"
